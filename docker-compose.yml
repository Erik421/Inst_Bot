version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./photos:/Inst_Bot/photos
    ports:
      - "5432:5432"

  app:
      build: .
      command: bash -c "yoyo apply -a --database \"postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}\" migrations && python main.py"
      volumes:
        - .:/app
      depends_on:
        - db
      environment:
        - DB_NAME=${DB_NAME}
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_HOST=db
        - DB_PORT=5432

volumes:
  pgdata: